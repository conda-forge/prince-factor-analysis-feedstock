{% set name = "prince" %}
{% set version = "0.20.0" %}

package:
  name: {{ name|lower }}-factor-analysis
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a35e3048f9b756d1fab16c6beaddc4ded604d70481947a488da753beae755263

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - altair >=5.0.0
    - pandas >=2.2.0
    - scikit-learn >=1.5.1

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - prince
  commands:
    - pip check

about:
  home: https://github.com/MaxHalford/prince
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Statistical factor analysis in Python
  doc_url: https://github.com/MaxHalford/prince
  dev_url: https://github.com/MaxHalford/prince

extra:
  recipe-maintainers:
    - mxr-conda
    - mwilson8
    - rluria14
    - benhuff
    - MaxHalford
